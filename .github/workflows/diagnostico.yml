name: Diagnóstico temporal de conexión

on:
  push:
    paths:
      - ".github/workflows/diagnostico.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: curl con HTTP/1.1
        run: |
          curl -s --http1.1 --max-time 60 -o /dev/null -w "curl http1.1: HTTP %{http_code}, %{size_download} bytes\n" \
            -H "Accept: application/json" \
            "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroProvincia/18" || echo "curl http1.1 falló"

      - name: Variantes de TLS en Python
        run: |
          pip -q install requests
          python - <<'EOF'
          import socket, ssl
          HOST = "sedeaplicaciones.minetur.gob.es"
          print("OpenSSL:", ssl.OPENSSL_VERSION)

          def prueba(nombre, ajustar):
              ctx = ssl.create_default_context()
              ajustar(ctx)
              try:
                  with socket.create_connection((HOST, 443), timeout=30) as s:
                      with ctx.wrap_socket(s, server_hostname=HOST) as t:
                          print(f"OK    {nombre}: {t.version()} {t.cipher()[0]} alpn={t.selected_alpn_protocol()}")
              except Exception as e:
                  print(f"FALLO {nombre}: {e!r}")

          prueba("por defecto", lambda c: None)
          prueba("alpn http/1.1 (como requests)", lambda c: c.set_alpn_protocols(["http/1.1"]))
          prueba("alpn h2 + http/1.1 (como curl)", lambda c: c.set_alpn_protocols(["h2", "http/1.1"]))
          prueba("solo TLS 1.2", lambda c: setattr(c, "maximum_version", ssl.TLSVersion.TLSv1_2))
          prueba("cifrados DEFAULT", lambda c: c.set_ciphers("DEFAULT"))
          prueba("cifrados DEFAULT@SECLEVEL=1", lambda c: c.set_ciphers("DEFAULT:@SECLEVEL=1"))
          prueba("legacy server connect", lambda c: setattr(c, "options", c.options | 0x4))

          import requests
          url = f"https://{HOST}/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroProvincia/18"
          for nombre, cab in [("requests sin cabeceras", {}),
                              ("requests con Accept json", {"Accept": "application/json"})]:
              try:
                  r = requests.get(url, headers=cab, timeout=60)
                  print(f"OK    {nombre}: HTTP {r.status_code}, {len(r.content)} bytes")
              except Exception as e:
                  print(f"FALLO {nombre}: {e!r}"[:300])
          EOF
